# Gitleaks config for Trovara OS CI.
# Extends defaults; allowlists known false positives (not real secrets).

title = "trovara-os"

[extend]
useDefault = true

[[allowlists]]
description = "Exact non-secret placeholders and advisory identifiers"
regexes = [
  '''^YOUR_CSRF$''',
  '''^trovara-os-a2hs-dismissed-until$''',
  '''^(noiler|broiler)\.day(1\.brooding|7\.gumboro|14\.newcastle|21\.litter|28\.closeout)$''',
]

[[allowlists]]
description = "Deterministic encryption fixture only in its unit test"
condition = "AND"
paths = ['''^api/src/lib/secret-box\.test\.ts$''']
regexes = ['''^0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef$''']
