# Opt-in worker only. Reuses OS private storage and malware scanning; no new mail provider.
# docker compose -f docker-compose.yml -f docker-compose.talent.yml up -d talent-worker
services:
  talent-worker:
    build:
      context: .
      dockerfile: Dockerfile.knowledge-worker
    restart: unless-stopped
    init: true
    user: node
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trovara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trovara_os}
      KNOWLEDGE_STORAGE_ENDPOINT: http://object-storage:8333
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      OCR_COMMAND: ocrmypdf
    command: ["sh", "-c", "while true; do npm run talent-worker -w api; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
      object-storage:
        condition: service_started
