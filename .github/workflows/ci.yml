name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://trovara:test@127.0.0.1:5432/trovara_os_test
    services:
      postgres:
        # Pin by digest (postgres:16 / 16.14 as of 2026-07-16 multi-arch index)
        image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: trovara
          POSTGRES_PASSWORD: test
          POSTGRES_DB: trovara_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trovara -d trovara_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Audit dependencies (high+)
        run: npm audit --workspaces --audit-level=high

      - name: Audit production dependencies (high+)
        run: npm audit --workspaces --omit=dev --audit-level=high

      - name: Verify database migrations
        run: npm run db:migrate

      - name: Run API tests
        run: npm test -w api

      - name: Typecheck API
        run: npm run build -w api

      - name: Typecheck app
        run: npm run build -w app
