services:
  db:
    image: postgres:17.2-alpine
    container_name: trovara-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trovara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trovara_os}
    ports:
      # Dev only: bound to localhost so host API can connect
      - "127.0.0.1:5432:5432"
    volumes:
      - trovara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trovara} -d ${POSTGRES_DB:-trovara_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trovara_pg_data:
