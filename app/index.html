<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trovara OS - Trovara Farm</title>
    <meta name="description" content="Trovara OS - Trovara Farm operations command center" />
    <meta name="theme-color" content="#1f6b42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trovara OS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/trovara-os-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/trovara-os-icon.svg" />
    <!-- Apply stored theme before paint. Default stays dark (current OS look). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('trovara_theme')
          var light = t === 'light'
          document.documentElement.classList.toggle('dark', !light)
          document.documentElement.classList.toggle('light', light)
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
          if (light) {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#eef3f0')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
